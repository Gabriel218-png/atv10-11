<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Tabuada Interativa</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <h2>Tabuada Interativa</h2>
        
        <div class="input-group">
            <label for="numero">Digite um número (1 a 20):</label>
            <input type="number" id="numero" min="1" max="20" placeholder="Ex: 7">
        </div>

        <div class="botoes">
            <button id="btnGerar" class="btn-primario">Gerar Tabuada</button>
            <button id="btnLimpar" class="btn-secundario">Limpar</button>
        </div>

        <p id="mensagemErro" class="erro"></p>
        <div id="resultado"></div>
    </div>

    <script src="../js/script.js"></script>
</body>
</html>
