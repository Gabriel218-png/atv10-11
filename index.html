<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoramento de Frequência Escolar</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="container">
        <h2>Monitoramento de Frequência Escolar</h2>

        <form id="formEstudante" class="card">
            <h3>Cadastrar Estudante</h3>
            <div class="form-grid">
                <input type="text" id="matricula" placeholder="Matrícula" required>
                <input type="text" id="nome" placeholder="Nome Completo" required>
                <input type="text" id="turma" placeholder="Turma (ex: 3A)" required>
                <input type="text" id="curso" placeholder="Curso" required>
            </div>
            <button type="submit" class="btn btn-primario">Cadastrar Aluno</button>
        </form>

        <form id="formFrequencia" class="card">
            <h3>Registrar Frequência</h3>
            <div class="form-grid">
                <select id="selectAluno" required>
                    <option value="">Selecione o Estudante</option>
                </select>
                <input type="date" id="dataRegistro" required>
                <select id="statusFrequencia" required>
                    <option value="P">Presença</option>
                    <option value="FJ">Falta Justificada</option>
                    <option value="FNJ">Falta NÃO Justificada</option>
                </select>
            </div>
            <button type="submit" class="btn btn-sucesso">Registrar Frequência</button>
        </form>

        <p id="mensagemErro" class="erro"></p>

        <div id="secaoAlertas" class="alertas-container oculto">
            <h3>Alertas Pedagógicos (>3 Faltas Injustificadas Consecutivas)</h3>
            <ul id="listaAlertas" class="lista-alertas"></ul>
        </div>

        <div class="card">
            <h3>Histórico de Frequência</h3>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Matrícula</th>
                            <th>Nome</th>
                            <th>Turma</th>
                            <th>Presenças</th>
                            <th>Faltas Just.</th>
                            <th>Faltas Não Just.</th>
                            <th>Histórico (Últimos registros)</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaHistorico"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../js/script.js"></script>
</body>

</html>
