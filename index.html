<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro e Listagem de Alunos</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <h2>Cadastro de Alunos</h2>
        
        <form id="formAluno">
            <div class="input-group">
                <label for="matricula">Matrícula:</label>
                <input type="text" id="matricula" placeholder="Ex: 2024001" required>
            </div>
            <div class="input-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" placeholder="Ex: Ana Silva" required>
            </div>
            <div class="input-group">
                <label for="idade">Idade:</label>
                <input type="number" id="idade" min="1" placeholder="Ex: 20" required>
            </div>
            <div class="input-group">
                <label for="curso">Curso:</label>
                <input type="text" id="curso" placeholder="Ex: Engenharia" required>
            </div>
            <button type="submit" class="btn">Cadastrar Aluno</button>
        </form>

        <p id="mensagemErro" class="erro"></p>

        <div class="listagem-header">
            <h3>Alunos Cadastrados</h3>
            <span id="totalAlunos" class="badge">Total: 0</span>
        </div>

        <ul id="listaAlunos" class="lista"></ul>
    </div>

    <script src="../js/script.js"></script>
</body>
</html>
