<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="container">
        <h2>Gerenciador de Tarefas</h2>

        <div class="indicadores">
            <div class="card-ind total">Total: <span id="indTotal">0</span></div>
            <div class="card-ind concluidas">Concluídas: <span id="indConcluidas">0</span></div>
            <div class="card-ind pendentes">Pendentes: <span id="indPendentes">0</span></div>
            <div class="card-ind atrasadas">Atrasadas: <span id="indAtrasadas">0</span></div>
        </div>

        <form id="formTarefa" class="card">
            <h3 id="tituloForm">Nova Tarefa</h3>
            <input type="hidden" id="tarefaId">
            <div class="form-group">
                <input type="text" id="titulo" placeholder="Título da Tarefa" required>
            </div>
            <div class="form-group">
                <textarea id="descricao" placeholder="Descrição da Tarefa" rows="2" required></textarea>
            </div>
            <div class="form-grid">
                <div>
                    <label>Prioridade:</label>
                    <select id="prioridade" required>
                        <option value="1">Baixa</option>
                        <option value="2">Média</option>
                        <option value="3">Alta</option>
                    </select>
                </div>
                <div>
                    <label>Prazo:</label>
                    <input type="date" id="prazo" required>
                </div>
            </div>
            <div class="botoes-form">
                <button type="submit" id="btnSalvar" class="btn btn-primario">Salvar Tarefa</button>
                <button type="button" id="btnCancelar" class="btn btn-secundario oculto">Cancelar</button>
            </div>
        </form>

        <div class="controles card">
            <div class="control-group">
                <label>Filtrar:</label>
                <select id="filtroStatus">
                    <option value="todas">Todas</option>
                    <option value="pendentes">Pendentes</option>
                    <option value="concluidas">Concluídas</option>
                    <option value="atrasadas">Atrasadas</option>
                </select>
            </div>
            <div class="control-group">
                <label>Ordenar por:</label>
                <select id="ordemCampo">
                    <option value="prazo">Prazo</option>
                    <option value="prioridade">Prioridade</option>
                </select>
            </div>
        </div>

        <ul id="listaTarefas" class="lista-tarefas"></ul>
    </div>

    <script src="../js/script.js"></script>
</body>

</html>
